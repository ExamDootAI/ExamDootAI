<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-en="ExamDootAI - Government Exam Alerts" data-bn="ExamDootAI - Government Exam Alerts">ExamDootAI - Government Exam Alerts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --controls-bg: #f1f5f9;
            --border-color: #e2e8f0;
            --sub-text: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --controls-bg: #334155;
            --border-color: #334155;
            --sub-text: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        body { 
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            transition: background 0.3s ease, color 0.3s ease;
        }
        .container { 
            max-width: 1000px; /* ডেস্কটপ সাইজের জন্য চওড়া বাড়ানো হলো */
            width: 100%;
            margin: 0 auto; 
            background: var(--container-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { 
            color: var(--primary); 
            margin: 0; 
            font-size: 26px;
            font-weight: 700;
        }
        .header-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .theme-btn, .auth-btn, .lang-select {
            background: var(--controls-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .theme-btn:hover, .auth-btn:hover, .lang-select:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .subtitle { 
            color: var(--sub-text); 
            margin-top: 8px;
            margin-bottom: 24px; 
            font-size: 14px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px;
        }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 24px; 
            background: var(--controls-bg);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .last-updated {
            font-size: 12px;
            color: var(--sub-text);
        }
        .refresh-btn { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 9px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px;
        }
        .refresh-btn:hover { background-color: var(--primary-hover); }
        .card { 
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary); 
            background: var(--card-bg); 
            margin-bottom: 20px; 
            padding: 20px; 
            border-radius: 14px; 
        }
        .exam-title { 
            font-size: 17px; 
            color: var(--text-color); 
            font-weight: 700; 
            margin-top: 0; 
            margin-bottom: 10px; 
        }
        .status { 
            background: #fef2f2; 
            color: #dc2626; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 12px; 
            display: inline-block; 
            margin-bottom: 12px; 
        }
        .status.active { background: #f0fdf4; color: #16a34a; }
        p { margin: 8px 0; font-size: 14px; line-height: 1.6; color: var(--sub-text); }
        p strong { color: var(--text-color); }
        a { color: var(--primary); text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }

        /* মোডাল স্টাইল */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--container-bg);
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
        .modal-content h3 { margin-top: 0; color: var(--primary); }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--controls-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }
        .social-btn {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .close-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>ExamDootAI 🚀</h1>
            <div class="header-btns">
                <select class="lang-select" id="lang-switch" onchange="changeLanguage()">
                    <option value="bn">বাংলা 🇮🇳</option>
                    <option value="en">English 🇬🇧</option>
                </select>
                <button class="auth-btn" id="auth-action-btn" onclick="openAuthModal()" data-bn="লগইন / সাইন আপ" data-en="Login / Sign Up">লগইন / সাইন আপ</button>
                <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle">🌙</button>
            </div>
        </div>
        <div class="subtitle" id="sub-title-text" data-bn="আপনার স্বয়ংক্রিয় পরীক্ষার অ্যালার্ট সিস্টেম" data-en="Your automated exam alert system">আপনার স্বয়ংক্রিয় পরীক্ষার অ্যালার্ট সিস্টেম</div>
        
        <div class="controls">
            <span class="last-updated" id="last-updated" data-bn="ডেটা চেক করা হচ্ছে... ⏳" data-en="Checking data... ⏳">ডেটা চেক করা হচ্ছে... ⏳</span>
            <button class="refresh-btn" onclick="fetchData()" data-bn="Refresh 🔄" data-en="Refresh 🔄">Refresh 🔄</button>
        </div>

        <div id="exams-container"></div>
    </div>

    <!-- লগইন মোডাল -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h3 id="modal-title" data-bn="লগইন করুন" data-en="Login">লগইন করুন</h3>
            
            <button class="social-btn" onclick="handleGoogleLogin()" data-bn="🌐 Google দিয়ে লগইন করুন" data-en="🌐 Login with Google">
                🌐 Google দিয়ে লগইন করুন
            </button>

            <p style="text-align: center; margin: 10px 0;" data-bn="অথবা ইমেল দিয়ে" data-en="Or with Email">অথবা ইমেল দিয়ে</p>
            <input type="email" id="email" placeholder="ইমেল লিখুন" data-bn-placeholder="ইমেল লিখুন" data-en-placeholder="Enter email">
            <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন" data-bn-placeholder="পাসওয়ার্ড লিখুন" data-en-placeholder="Enter password">
            <div id="auth-error" style="color: red; font-size: 12px; margin-bottom: 10px;"></div>
            
            <div class="modal-buttons">
                <button class="refresh-btn" onclick="handleEmailAuth()" data-bn="ইমেল সাবমিট" data-en="Submit Email">ইমেল সাবমিট</button>
                <button class="close-btn" onclick="closeAuthModal()" data-bn="বন্ধ করুন" data-en="Close">বন্ধ করুন</button>
            </div>

            <p style="text-align: center; margin-top: 15px; font-size: 13px;">
                <span data-bn="অ্যাকাউন্ট নেই?" data-en="Don't have an account?">অ্যাকাউন্ট নেই?</span> 
                <a href="#" onclick="toggleAuthMode(event)" id="switch-mode-link" data-bn="সাইন আপ করুন" data-en="Sign Up">সাইন আপ করুন</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCuh78TDVUJFQBebEtzrhlo09usrasXUgU",
            authDomain: "diti-53fb6.firebaseapp.com",
            projectId: "diti-53fb6",
            storageBucket: "diti-53fb6.firebasestorage.app",
            messagingSenderId: "775144037393",
            appId: "1:775144037393:web:e46ea30ea46edd0acd25b0",
            measurementId: "G-Q39EX6NE8Z"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let isSignUp = false;

        window.openAuthModal = function() {
            document.getElementById('auth-modal').style.display = 'flex';
        }

        window.closeAuthModal = function() {
            document.getElementById('auth-modal').style.display = 'none';
        }

        window.toggleAuthMode = function(e) {
            e.preventDefault();
            isSignUp = !isSignUp;
            const lang = localStorage.getItem('lang') || 'bn';
            if(lang === 'en') {
                document.getElementById('modal-title').innerText = isSignUp ? 'Sign Up' : 'Login';
                document.getElementById('switch-mode-link').innerText = isSignUp ? 'Login' : 'Sign Up';
            } else {
                document.getElementById('modal-title').innerText = isSignUp ? 'সাইন আপ করুন' : 'লগইন করুন';
                document.getElementById('switch-mode-link').innerText = isSignUp ? 'লগইন করুন' : 'সাইন আপ করুন';
            }
        }

        window.handleEmailAuth = function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('auth-error');
            errorElement.innerText = '';

            if(isSignUp) {
                createUserWithEmailAndPassword(auth, email, password)
                    .then(() => closeAuthModal())
                    .catch((error) => errorElement.innerText = error.message);
            } else {
                signInWithEmailAndPassword(auth, email, password)
                    .then(() => closeAuthModal())
                    .catch((error) => errorElement.innerText = error.message);
            }
        }

        window.handleGoogleLogin = function() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then(() => closeAuthModal())
                .catch((error) => alert(error.message));
        }

        onAuthStateChanged(auth, (user) => {
            const authBtn = document.getElementById('auth-action-btn');
            const lang = localStorage.getItem('lang') || 'bn';
            if (user) {
                authBtn.innerText = (lang === 'en') ? 'Logout' : 'লগআউট';
                authBtn.onclick = () => signOut(auth);
            } else {
                authBtn.innerText = (lang === 'en') ? 'Login / Sign Up' : 'লগইন / সাইন আপ';
                authBtn.onclick = openAuthModal;
            }
        });
    </script>

    <script>
        function changeLanguage() {
            const lang = document.getElementById('lang-switch').value;
            localStorage.setItem('lang', lang);

            document.querySelectorAll('[data-bn]').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });

            document.querySelectorAll('[data-bn-placeholder]').forEach(el => {
                el.placeholder = el.getAttribute(`data-${lang}-placeholder`);
            });

            const authBtn = document.getElementById('auth-action-btn');
            if(authBtn.innerText === 'লগআউট' || authBtn.innerText === 'Logout') {
                authBtn.innerText = (lang === 'en') ? 'Logout' : 'লগআউট';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('lang') || 'bn';
            document.getElementById('lang-switch').value = savedLang;
            changeLanguage();
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeBtn = document.getElementById('theme-toggle');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
            document.getElementById('theme-toggle').innerHTML = '☀️';
        }

        function fetchData() {
            const container = document.getElementById('exams-container');
            const lastUpdated = document.getElementById('last-updated');
            const lang = localStorage.getItem('lang') || 'bn';
            
            container.innerHTML = `<p style="text-align:center; font-weight:600; color:var(--primary); padding: 20px;">${lang === 'en' ? 'Loading new data... ⏳' : 'নতুন ডেটা লোড হচ্ছে... ⏳'}</p>`;
            
            const url = 'exams_data.json?t=' + new Date().getTime();
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = '';
                    if(data.exams && data.exams.length > 0) {
                        data.exams.forEach(exam => {
                            let statusClass = 'status';
                            if(exam.status.includes('🟢') || exam.status.includes('🔔')) {
                                statusClass += ' active';
                            }
                            
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <h3 class="exam-title">${exam.exam_name}</h3>
                                <div class="${statusClass}">${lang === 'en' ? 'Status: ' : 'স্ট্যাটাস: '} ${exam.status}</div>
                                <p><strong>${lang === 'en' ? 'Form Fill-up Start:' : 'ফর্ম ফিলাপ শুরু:'}</strong> ${exam.form_fillup_start}</p>
                                <p><strong>${lang === 'en' ? 'Form Fill-up End:' : 'ফর্ম ফিলাপ শেষ:'}</strong> ${exam.form_fillup_end}</p>
                            `;
                            
                            const links = card.getElementsByTagName('a');
                            for (let link of links) {
                                link.setAttribute('target', '_blank');
                                link.setAttribute('rel', 'noopener noreferrer');
                            }

                            container.appendChild(card);
                        });
                        
                        const now = new Date();
                        let timeString = now.toLocaleTimeString(lang === 'en' ? 'en-US' : 'bn-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        lastUpdated.innerHTML = `<strong>${lang === 'en' ? 'Last Update:' : 'শেষ আপডেট:'}</strong> ${timeString}`;
                    } else {
                        container.innerHTML = `<p style="text-align:center;">${lang === 'en' ? 'No data found!' : 'কোনো ডেটা পাওয়া যায়নি!'}</p>`;
                    }
                })
                .catch(error => {
                    container.innerHTML = `<p style="color:#dc2626; text-align:center; font-weight:600;">${lang === 'en' ? 'Error loading data! Please try again later.' : 'ডেটা লোড করতে সমস্যা হয়েছে! একটু পর আবার চেষ্টা করুন।'}</p>`;
                    console.error('Error:', error);
                });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
