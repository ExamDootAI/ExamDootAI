<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamDootAI - Government Exam Alerts</title>
    <style>
        :root { --bg-color: #eef2f3; --container-bg: #ffffff; --text-color: #333333; --card-bg: #fafbfc; --sub-text: #666666; }
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: var(--text-color); }
        .container { max-width: 600px; margin: 0 auto; background: var(--container-bg); padding: 20px; border-radius: 12px; }
        .card { border-left: 5px solid #007bff; background: var(--card-bg); margin-bottom: 20px; padding: 18px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .exam-title { font-size: 18px; color: #007bff; margin-bottom: 10px; }
        .status { background: #e6f4ea; color: #1e8e3e; padding: 4px 10px; border-radius: 5px; font-size: 13px; display: inline-block; margin-bottom: 10px; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ExamDootAI 🚀</h1>
        <div class="controls">
            <select id="langSelect" onchange="filterExams()">
                <option value="bn">বাংলা (Bengali)</option>
                <option value="en">English</option>
            </select>
            <button onclick="fetchData()">Refresh 🔄</button>
        </div>
        <div id="exams-container"></div>
    </div>

    <script>
        let allExamsData = [];

        async function fetchData() {
            const container = document.getElementById('exams-container');
            container.innerHTML = 'লোড হচ্ছে...';
            try {
                const response = await fetch('exams_data.json?t=' + new Date().getTime());
                const data = await response.json();
                allExamsData = data.exams || [];
                filterExams();
            } catch (e) {
                container.innerHTML = 'ডেটা লোড করতে সমস্যা হয়েছে।';
            }
        }

        function filterExams() {
            const lang = document.getElementById('langSelect').value;
            const container = document.getElementById('exams-container');
            container.innerHTML = '';

            allExamsData.forEach(exam => {
                // লজিক: যদি ডাটা অবজেক্ট হয় তবে ল্যাংগুয়েজ কি দিয়ে খুঁজবে, না হলে সরাসরি টেক্সট নিবে
                const name = (exam.exam_name && typeof exam.exam_name === 'object') ? (exam.exam_name[lang] || exam.exam_name['en']) : exam.exam_name;
                const status = (exam.status && typeof exam.status === 'object') ? (exam.status[lang] || exam.status['en']) : exam.status;
                const start = (exam.form_fillup_start && typeof exam.form_fillup_start === 'object') ? (exam.form_fillup_start[lang] || exam.form_fillup_start['en']) : exam.form_fillup_start;
                const end = (exam.form_fillup_end && typeof exam.form_fillup_end === 'object') ? (exam.form_fillup_end[lang] || exam.form_fillup_end['en']) : exam.form_fillup_end;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3 class="exam-title">${name}</h3>
                    <div class="status">${status}</div>
                    <p><strong>শুরু:</strong> ${start}</p>
                    <p><strong>শেষ:</strong> ${end}</p>
                `;
                container.appendChild(card);
            });
        }
        window.onload = fetchData;
    </script>
</body>
</html>
