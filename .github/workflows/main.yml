name: ExamDootAI Auto-Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests deep-translator

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push Updated Data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "ExamDootAI-Bot"
        git config --global user.email "bot@examdootai.com"
        git add exams_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update exam data" && git push)
