<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamDootAI - Government Exam Alerts</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f3; 
            margin: 0; 
            padding: 15px; 
            color: #333; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h1 { 
            text-align: center; 
            color: #1a365d; 
            margin-top: 0;
            margin-bottom: 5px; 
        }
        .subtitle { 
            text-align: center; 
            color: #666; 
            margin-bottom: 20px; 
            font-size: 15px; 
            border-bottom: 2px solid #007bff; 
            padding-bottom: 15px;
        }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .last-updated {
            font-size: 13px;
            color: #555;
        }
        .refresh-btn { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .refresh-btn:hover { background-color: #0056b3; }
        .refresh-btn:active { transform: scale(0.95); }
        .card { 
            border-left: 5px solid #007bff; 
            background: #fafbfc; 
            margin-bottom: 20px; 
            padding: 18px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
        }
        .exam-title { 
            font-size: 18px; 
            color: #007bff; 
            font-weight: bold; 
            margin-top: 0; 
            margin-bottom: 12px; 
        }
        .status { 
            background: #ffebeb; 
            color: #d32f2f; 
            padding: 4px 10px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 13px; 
            display: inline-block; 
            margin-bottom: 12px; 
        }
        .status.active { background: #e6f4ea; color: #1e8e3e; }
        p { margin: 8px 0; font-size: 15px; line-height: 1.5; color: #202124; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ExamDootAI 🚀</h1>
        <div class="subtitle">আপনার স্বয়ংক্রিয় পরীক্ষার অ্যালার্ট সিস্টেম</div>
        
        <div class="controls">
            <span class="last-updated" id="last-updated">ডেটা চেক করা হচ্ছে... ⏳</span>
            <button class="refresh-btn" onclick="fetchData()">Refresh 🔄</button>
        </div>

        <div id="exams-container">
            <!-- ডায়নামিক ডেটা এখানে আসবে -->
        </div>
    </div>

    <script>
        function fetchData() {
            const container = document.getElementById('exams-container');
            const lastUpdated = document.getElementById('last-updated');
            container.innerHTML = '<p style="text-align:center; font-weight:bold; color:#007bff;">নতুন ডেটা লোড হচ্ছে... ⏳</p>';
            
            // Cache busting - ব্রাউজার যাতে পুরনো ডেটা না দেখায়
            const url = 'exams_data.json?t=' + new Date().getTime();
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = '';
                    if(data.exams && data.exams.length > 0) {
                        data.exams.forEach(exam => {
                            let statusClass = 'status';
                            if(exam.status.includes('🟢') || exam.status.includes('🔔')) {
                                statusClass += ' active';
                            }
                            
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <h3 class="exam-title">${exam.exam_name}</h3>
                                <div class="${statusClass}">স্ট্যাটাস: ${exam.status}</div>
                                <p><strong>ফর্ম ফিলাপ শুরু:</strong> ${exam.form_fillup_start}</p>
                                <p><strong>ফর্ম ফিলাপ শেষ:</strong> ${exam.form_fillup_end}</p>
                            `;
                            container.appendChild(card);
                        });
                        
                        // বর্তমান সময় সেট করা
                        const now = new Date();
                        let timeString = now.toLocaleTimeString('bn-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        lastUpdated.innerHTML = `<strong>শেষ আপডেট:</strong><br>${timeString}`;
                    } else {
                        container.innerHTML = '<p style="text-align:center;">কোনো ডেটা পাওয়া যায়নি!</p>';
                    }
                })
                .catch(error => {
                    container.innerHTML = '<p style="color:red; text-align:center; font-weight:bold;">ডেটা লোড করতে সমস্যা হয়েছে! একটু পর আবার চেষ্টা করুন।</p>';
                    console.error('Error:', error);
                });
        }

        // পেজ খুললেই স্বয়ংক্রিয়ভাবে ডেটা আনবে
        window.onload = fetchData;
    </script>
</body>
</html>
