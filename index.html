<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamDootAI - Government Exam Alerts</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f3; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        h1 { 
            color: #2c3e50; 
            text-align: center; 
            border-bottom: 2px solid #3498db; 
            padding-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .exam-card { 
            border-left: 6px solid #3498db; 
            background: #f8f9fa; 
            padding: 15px; 
            margin-top: 15px; 
            border-radius: 8px; 
        }
        .exam-card h2 { 
            margin: 0 0 10px 0; 
            color: #2980b9; 
            font-size: 18px; 
        }
        .status { 
            font-weight: bold; 
            color: #e74c3c; 
            background: #fadbd8;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 14px;
        }
        p { margin: 8px 0; color: #34495e; font-size: 15px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>ExamDootAI 🚀</h1>
        <p class="subtitle">আপনার স্বয়ংক্রিয় পরীক্ষার অ্যালার্ট সিস্টেম</p>
        
        <div id="exams-container">
            <p style="text-align: center; color: #7f8c8d;">ডেটা লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
        </div>
    </div>

    <script>
        // ডেটাবেসের সরাসরি লিংক এবং ক্যাশ এড়ানোর সেটিংস
        const dbUrl = 'https://examdootai.github.io/ExamDootAI/exams_data.json';

        fetch(dbUrl, { cache: "no-store" })
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('exams-container');
                container.innerHTML = ''; // Loading টেক্সট সরিয়ে ফেলা
                
                // ডেটাবেসের স্ট্রাকচার অনুযায়ী ডেটা খুঁজে বের করা
                let examList = [];
                if (Array.isArray(data)) {
                    examList = data;
                } else if (data.exams && Array.isArray(data.exams)) {
                    examList = data.exams;
                }

                if (examList.length > 0) {
                    examList.forEach(exam => {
                        const card = document.createElement('div');
                        card.className = 'exam-card';
                        
                        // JSON-এ যে নামেই ডেটা থাকুক না কেন, এটি ধরে নেবে
                        const examName = exam.exam_name || exam.title || exam.name || 'অজানা পরীক্ষা';
                        const examStatus = exam.status || exam.date || 'নতুন আপডেট উপলব্ধ';
                        const formStart = exam.form_fillup_start || 'শীঘ্রই জানানো হবে';
                        const formEnd = exam.form_fillup_end || 'শীঘ্রই জানানো হবে';

                        card.innerHTML = `
                            <h2>${examName}</h2>
                            <p>স্ট্যাটাস: <span class="status">${examStatus}</span></p>
                            <p><strong>ফর্ম ফিলাপ শুরু:</strong> ${formStart}</p>
                            <p><strong>ফর্ম ফিলাপ শেষ:</strong> ${formEnd}</p>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="text-align:center; color:#e74c3c; font-weight:bold;">এই মুহূর্তে নতুন কোনো পরীক্ষার ডেটা নেই।</p>';
                }
            })
            .catch(error => {
                console.error('Fetch Error:', error);
                document.getElementById('exams-container').innerHTML = '<p style="text-align:center; color:red; font-weight:bold;">ডেটা লোড করতে সমস্যা হচ্ছে। ডেটাবেস আপডেট হচ্ছে কিনা চেক করুন।</p>';
            });
    </script>
</body>
</html>
