<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamDootAI - Government Exam Alerts</title>
    <style>
        :root {
            --bg-color: #eef2f3;
            --container-bg: #ffffff;
            --text-color: #333333;
            --card-bg: #fafbfc;
            --controls-bg: #f8f9fa;
            --border-color: #e9ecef;
            --sub-text: #666666;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
            --controls-bg: #2d2d2d;
            --border-color: #3d3d3d;
            --sub-text: #b0b0b0;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--container-bg); 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            transition: background 0.3s;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { 
            color: #007bff; 
            margin: 0; 
            font-size: 24px;
        }
        .theme-btn {
            background: none;
            border: 2px solid #007bff;
            color: #007bff;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }
        .theme-btn:hover {
            background: #007bff;
            color: white;
        }
        .subtitle { 
            color: var(--sub-text); 
            margin-top: 5px;
            margin-bottom: 20px; 
            font-size: 15px; 
            border-bottom: 2px solid #007bff; 
            padding-bottom: 15px;
        }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            background: var(--controls-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .last-updated {
            font-size: 13px;
            color: var(--sub-text);
        }
        .refresh-btn { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .refresh-btn:hover { background-color: #0056b3; }
        .refresh-btn:active { transform: scale(0.95); }
        .card { 
            border-left: 5px solid #007bff; 
            background: var(--card-bg); 
            margin-bottom: 20px; 
            padding: 18px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
            transition: transform 0.2s, background 0.3s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .exam-title { 
            font-size: 18px; 
            color: #007bff; 
            font-weight: bold; 
            margin-top: 0; 
            margin-bottom: 12px; 
        }
        .status { 
            background: #ffebeb; 
            color: #d32f2f; 
            padding: 4px 10px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 13px; 
            display: inline-block; 
            margin-bottom: 12px; 
        }
        .status.active { background: #e6f4ea; color: #1e8e3e; }
        p { margin: 8px 0; font-size: 15px; line-height: 1.5; color: var(--text-color); }
        
        /* লিঙ্কের ডিজাইন সুন্দর করার জন্য */
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>ExamDootAI 🚀</h1>
            <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle">🌙 ডার্ক মোড</button>
        </div>
        <div class="subtitle">আপনার স্বয়ংক্রিয় পরীক্ষার অ্যালার্ট সিস্টেম</div>
        
        <div class="controls">
            <span class="last-updated" id="last-updated">ডেটা চেক করা হচ্ছে... ⏳</span>
            <button class="refresh-btn" onclick="fetchData()">Refresh 🔄</button>
        </div>

        <div id="exams-container">
            <!-- ডায়নামিক ডেটা এখানে আসবে -->
        </div>
    </div>

    <script>
        // ডার্ক মোড হ্যান্ডলার
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeBtn = document.getElementById('theme-toggle');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '🌙 ডার্ক মোড';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '☀️ লাইট মোড';
                localStorage.setItem('theme', 'dark');
            }
        }

        // সেভ করা থিম লোড করা
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
            document.getElementById('theme-toggle').innerHTML = '☀️ লাইট মোড';
        }

        function fetchData() {
            const container = document.getElementById('exams-container');
            const lastUpdated = document.getElementById('last-updated');
            container.innerHTML = '<p style="text-align:center; font-weight:bold; color:#007bff;">নতুন ডেটা লোড হচ্ছে... ⏳</p>';
            
            const url = 'exams_data.json?t=' + new Date().getTime();
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = '';
                    if(data.exams && data.exams.length > 0) {
                        data.exams.forEach(exam => {
                            let statusClass = 'status';
                            if(exam.status.includes('🟢') || exam.status.includes('🔔')) {
                                statusClass += ' active';
                            }
                            
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <h3 class="exam-title">${exam.exam_name}</h3>
                                <div class="${statusClass}">স্ট্যাটাস: ${exam.status}</div>
                                <p><strong>ফর্ম ফিলাপ শুরু:</strong> ${exam.form_fillup_start}</p>
                                <p><strong>ফর্ম ফিলাপ শেষ:</strong> ${exam.form_fillup_end}</p>
                            `;
                            
                            // সিকিউরিটি ও প্রাইভেসি এরর এড়ানোর জন্য সব লিঙ্কে সেফটি অ্যাট্রিবিউট যোগ করা
                            const links = card.getElementsByTagName('a');
                            for (let link of links) {
                                link.setAttribute('target', '_blank');
                                link.setAttribute('rel', 'noopener noreferrer');
                            }

                            container.appendChild(card);
                        });
                        
                        const now = new Date();
                        let timeString = now.toLocaleTimeString('bn-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        lastUpdated.innerHTML = `<strong>শেষ আপডেট:</strong><br>${timeString}`;
                    } else {
                        container.innerHTML = '<p style="text-align:center;">কোনো ডেটা পাওয়া যায়নি!</p>';
                    }
                })
                .catch(error => {
                    container.innerHTML = '<p style="color:red; text-align:center; font-weight:bold;">ডেটা লোড করতে সমস্যা হয়েছে! একটু পর আবার চেষ্টা করুন।</p>';
                    console.error('Error:', error);
                });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
