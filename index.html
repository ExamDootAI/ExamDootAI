<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamDootAI - Government Exam Alerts</title>
    <!-- প্রিমিয়াম ফন্ট যুক্ত করা হলো -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --container-bg: #ffffff;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --controls-bg: #f1f5f9;
            --border-color: #e2e8f0;
            --sub-text: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --controls-bg: #334155;
            --border-color: #334155;
            --sub-text: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        body { 
            font-family: 'Poppins', 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            transition: background 0.3s ease, color 0.3s ease;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: var(--container-bg); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
            transition: background 0.3s ease;
            border: 1px solid var(--border-color);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { 
            color: var(--primary); 
            margin: 0; 
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .theme-btn {
            background: var(--controls-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .theme-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .subtitle { 
            color: var(--sub-text); 
            margin-top: 8px;
            margin-bottom: 24px; 
            font-size: 14px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px;
        }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 24px; 
            background: var(--controls-bg);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .last-updated {
            font-size: 12px;
            color: var(--sub-text);
            line-height: 1.4;
        }
        .refresh-btn { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 9px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }
        .refresh-btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .refresh-btn:active { transform: translateY(0); }
        .card { 
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary); 
            background: var(--card-bg); 
            margin-bottom: 20px; 
            padding: 20px; 
            border-radius: 14px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); 
            transition: all 0.25s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-color: var(--primary);
        }
        .exam-title { 
            font-size: 17px; 
            color: var(--text-color); 
            font-weight: 700; 
            margin-top: 0; 
            margin-bottom: 10px; 
        }
        .status { 
            background: #fef2f2; 
            color: #dc2626; 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 12px; 
            display: inline-block; 
            margin-bottom: 12px; 
            letter-spacing: 0.3px;
        }
        .status.active { background: #f0fdf4; color: #16a34a; }
        p { margin: 8px 0; font-size: 14px; line-height: 1.6; color: var(--sub-text); }
        p strong { color: var(--text-color); font-weight: 600; }
        
        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>ExamDootAI 🚀</h1>
            <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle">🌙 ডার্ক মোড</button>
        </div>
        <div class="subtitle">আপনার স্বয়ংক্রিয় পরীক্ষার অ্যালার্ট সিস্টেম</div>
        
        <div class="controls">
            <span class="last-updated" id="last-updated">ডেটা চেক করা হচ্ছে... ⏳</span>
            <button class="refresh-btn" onclick="fetchData()">Refresh 🔄</button>
        </div>

        <div id="exams-container">
            <!-- ডায়নামিক ডেটা এখানে আসবে -->
        </div>
    </div>

    <script>
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeBtn = document.getElementById('theme-toggle');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '🌙 ডার্ক মোড';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '☀️ লাইট মোড';
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
            document.getElementById('theme-toggle').innerHTML = '☀️ লাইট মোড';
        }

        function fetchData() {
            const container = document.getElementById('exams-container');
            const lastUpdated = document.getElementById('last-updated');
            container.innerHTML = '<p style="text-align:center; font-weight:600; color:var(--primary); padding: 20px;">নতুন ডেটা লোড হচ্ছে... ⏳</p>';
            
            const url = 'exams_data.json?t=' + new Date().getTime();
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = '';
                    if(data.exams && data.exams.length > 0) {
                        data.exams.forEach(exam => {
                            let statusClass = 'status';
                            if(exam.status.includes('🟢') || exam.status.includes('🔔')) {
                                statusClass += ' active';
                            }
                            
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <h3 class="exam-title">${exam.exam_name}</h3>
                                <div class="${statusClass}">স্ট্যাটাস: ${exam.status}</div>
                                <p><strong>ফর্ম ফিলাপ শুরু:</strong> ${exam.form_fillup_start}</p>
                                <p><strong>ফর্ম ফিলাপ শেষ:</strong> ${exam.form_fillup_end}</p>
                            `;
                            
                            const links = card.getElementsByTagName('a');
                            for (let link of links) {
                                link.setAttribute('target', '_blank');
                                link.setAttribute('rel', 'noopener noreferrer');
                            }

                            container.appendChild(card);
                        });
                        
                        const now = new Date();
                        let timeString = now.toLocaleTimeString('bn-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        lastUpdated.innerHTML = `<strong>শেষ আপডেট:</strong> ${timeString}`;
                    } else {
                        container.innerHTML = '<p style="text-align:center;">কোনো ডেটা পাওয়া যায়নি!</p>';
                    }
                })
                .catch(error => {
                    container.innerHTML = '<p style="color:#dc2626; text-align:center; font-weight:600;">ডেটা লোড করতে সমস্যা হয়েছে! একটু পর আবার চেষ্টা করুন।</p>';
                    console.error('Error:', error);
                });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
