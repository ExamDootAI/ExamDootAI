name: Daily Exam Scraper Auto-Run

on:
  schedule:
    # সকাল ৭:৩০, দুপুর ১:৩০, সন্ধ্যা ৭:৩০ এবং রাত ১০:৩০ মিনিটে (IST) বটটি রান করবে
    - cron: '0 2,8,14,17 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add exams_data.json
        git commit -m "Auto-update exam data via Cron Timer" || echo "No changes to commit"
        git push
