<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamDootAI - Government Exam Alerts</title>
    <style>
        :root {
            --bg-color: #eef2f3;
            --container-bg: #ffffff;
            --text-color: #333333;
            --card-bg: #fafbfc;
            --controls-bg: #f8f9fa;
            --border-color: #e9ecef;
            --sub-text: #666666;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
            --controls-bg: #2d2d2d;
            --border-color: #3d3d3d;
            --sub-text: #b0b0b0;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0; 
            color: var(--text-color); 
            transition: background 0.3s, color 0.3s;
        }
        
        /* এখানে max-width তুলে দিয়ে width 100% করা হয়েছে যাতে স্ক্রিন জুড়ে থাকে */
        .container { 
            width: 100%; 
            min-height: 100vh;
            background: var(--container-bg); 
            padding: 20px; 
            box-sizing: border-box;
            box-shadow: none; 
            transition: background 0.3s;
        }

        /* বড় স্ক্রিন বা ল্যাপটপের জন্য কন্টেইনার কিছুটা নির্দিষ্ট থাকবে, কিন্তু মোবাইল বা ডেস্কটপ মোডে ফুল স্ক্রিন নেবে */
        @media (min-width: 768px) {
            .container {
                max-width: 900px;
                margin: 20px auto;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                min-height: auto;
            }
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { 
            color: #007bff; 
            margin: 0; 
            font-size: 24px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .theme-btn, .login-btn {
            background: none;
            border: 2px solid #007bff;
            color: #007bff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }
        .login-btn {
            background: #007bff;
            color: white;
        }
        .theme-btn:hover {
            background: #007bff;
            color: white;
        }
        .login-btn:hover {
            background: #0056b3;
            border-color: #0056b3;
        }
        .subtitle { 
            color: var(--sub-text); 
            margin-top: 5px;
            margin-bottom: 20px; 
            font-size: 15px; 
            border-bottom: 2px solid #007bff; 
            padding-bottom: 15px;
        }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            background: var(--controls-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .last-updated {
            font-size: 13px;
            color: var(--sub-text);
        }
        .refresh-btn { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .refresh-btn:hover { background-color: #0056b3; }
        
        .card { 
            border-left: 5px solid #007bff; 
            background: var(--card-bg); 
            margin-bottom: 20px; 
            padding: 18px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
            transition: transform 0.2s, background 0.3s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .exam-title { 
            font-size: 18px; 
            color: #007bff; 
            font-weight: bold; 
            margin-top: 0; 
            margin-bottom: 12px; 
        }
        .status { 
            background: #ffebeb; 
            color: #d32f2f; 
            padding: 4px 10px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 13px; 
            display: inline-block; 
            margin-bottom: 12px; 
        }
        .status.active { background: #e6f4ea; color: #1e8e3e; }
        p { margin: 8px 0; font-size: 15px; line-height: 1.5; color: var(--text-color); }
        
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }

        /* মডাল স্টাইল */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h3 { margin-bottom: 15px; color: #007bff; }
        .auth-option-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }
        .google-auth { background: #db4437; }
        .phone-auth { background: #28a745; }
        .close-modal {
            background: #6c757d;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-top">
            <h1>ExamDootAI 🚀</h1>
            <div class="header-actions">
                <button class="login-btn" onclick="openLoginModal()">লগইন / সাইন-আপ</button>
                <button class="theme-btn" onclick="toggleTheme()" id="theme-toggle">🌙 মোড</button>
            </div>
        </div>
        <div class="subtitle">আপনার স্বয়ংক্রিয় পরীক্ষার অ্যালার্ট সিস্টেম</div>
        
        <div class="controls">
            <span class="last-updated" id="last-updated">ডেটা চেক করা হচ্ছে... ⏳</span>
            <button class="refresh-btn" onclick="fetchData()">Refresh 🔄</button>
        </div>

        <div id="exams-container">
            <!-- ডায়নামিক ডেটা এখানে আসবে -->
        </div>
    </div>

    <!-- লগইন পপআপ মডাল -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3>প্রবেশ করুন / অ্যাকাউন্ট তৈরি করুন</h3>
            <p style="font-size: 13px; margin-bottom: 15px;">আপনার পরীক্ষার অ্যালার্ট সুরক্ষিত রাখতে লগইন করুন।</p>
            <button class="auth-option-btn google-auth" onclick="authWithGoogle()">🔵 Google Gmail দিয়ে লগইন</button>
            <button class="auth-option-btn phone-auth" onclick="authWithPhone()">🟢 মোবাইল নম্বর (OTP) দিয়ে লগইন</button>
            <button class="auth-option-btn close-modal" onclick="closeLoginModal()">বন্ধ করুন</button>
        </div>
    </div>

    <script>
        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }
        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function authWithGoogle() {
            alert("Google Gmail সিকিউর অথেন্টিকেশন প্রসেস শুরু হচ্ছে...");
            closeLoginModal();
        }

        function authWithPhone() {
            let phone = prompt("আপনার ১০ ডিজিটের মোবাইল নম্বর দিন:");
            if(phone && phone.length >= 10) {
                alert("আপনার নম্বরে একটি ওটিপি (OTP) পাঠানো হয়েছে: " + phone);
                closeLoginModal();
            } else if(phone) {
                alert("দয়া করে সঠিক মোবাইল নম্বর প্রদান করুন!");
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const themeBtn = document.getElementById('theme-toggle');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '🌙 মোড';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '☀️ মোড';
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
            document.getElementById('theme-toggle').innerHTML = '☀️ মোড';
        }

        function fetchData() {
            const container = document.getElementById('exams-container');
            const lastUpdated = document.getElementById('last-updated');
            container.innerHTML = '<p style="text-align:center; font-weight:bold; color:#007bff;">নতুন ডেটা লোড হচ্ছে... ⏳</p>';
            
            const url = 'exams_data.json?t=' + new Date().getTime();
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = '';
                    if(data.exams && data.exams.length > 0) {
                        data.exams.forEach(exam => {
                            let statusClass = 'status';
                            if(exam.status.includes('🟢') || exam.status.includes('🔔')) {
                                statusClass += ' active';
                            }
                            
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <h3 class="exam-title">${exam.exam_name}</h3>
                                <div class="${statusClass}">স্ট্যাটাস: ${exam.status}</div>
                                <p><strong>ফর্ম ফিলাপ শুরু:</strong> ${exam.form_fillup_start}</p>
                                <p><strong>ফর্ম ফিলাপ শেষ:</strong> ${exam.form_fillup_end}</p>
                            `;
                            
                            const links = card.getElementsByTagName('a');
                            for (let link of links) {
                                link.setAttribute('target', '_blank');
                                link.setAttribute('rel', 'noopener noreferrer');
                            }

                            container.appendChild(card);
                        });
                        
                        const now = new Date();
                        let timeString = now.toLocaleTimeString('bn-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        lastUpdated.innerHTML = `<strong>শেষ আপডেট:</strong><br>${timeString}`;
                    } else {
                        container.innerHTML = '<p style="text-align:center;">কোনো ডেটা পাওয়া যায়নি!</p>';
                    }
                })
                .catch(error => {
                    container.innerHTML = '<p style="color:red; text-align:center; font-weight:bold;">ডেটা লোড করতে সমস্যা হয়েছে! একটু পর আবার চেষ্টা করুন।</p>';
                    console.error('Error:', error);
                });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
